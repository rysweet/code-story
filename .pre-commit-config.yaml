repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: mkdocs-build
        name: mkdocs build (strict)
        entry: uv run mkdocs build --strict --site-dir /tmp/mkdocs-build
        language: system
        pass_filenames: false
        always_run: true
        description: "Build MkDocs documentation (strict mode, fail on warnings)"
  - repo: https://github.com/lycheeverse/lychee
    rev: v0.15.1
    hooks:
      - id: lychee
        language: system
        args:
          - --config
          - lychee.toml
          - --no-progress
          - docs/**/*.md
          - README.md