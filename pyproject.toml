[project]
name = "codestory"
version = "0.1.0"
description = "Modular code graph and pipeline toolkit"
authors = [
  { name = "CodeStory Authors", email = "dev@example.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
  "pydantic>=2.0.0",
  "neo4j>=5.0.0",
  "rich>=13.0.0",
  "typer>=0.12.0"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "pyright",
  "pre-commit"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pyright]
include = ["codestory"]
exclude = ["tests"]
typeCheckingMode = "strict"

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["codestory"]

[tool.coverage.run]
branch = true
source = ["codestory"]

[tool.coverage.report]
show_missing = true
skip_covered = true
[tool.pytest.ini_options]
addopts = "-q"
[tool.setuptools.packages.find]
where = ["codestory"]