version: "3.8"

services:
  neo4j:
    image: neo4j:community
    container_name: codestory-neo4j-test
    ports:
      - "7475:7474"  # HTTP - using different port to avoid conflicts
      - "7687:7687"  # Bolt - using standard containerized port
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_initial_dbms_default__database=neo4j
    volumes:
      - neo4j_test_data:/data
      - neo4j_test_logs:/logs
      - ./tests/fixtures/cypher:/import  # Mount fixtures directory for data import
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 && (echo 'RETURN 1' | cypher-shell -u neo4j -p password) || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s
    restart: on-failure

  redis:
    image: redis:7.2.4-alpine
    container_name: codestory-redis-test
    ports:
      - "6380:6379"  # Using different port to avoid conflicts
    environment:
      - REDIS__URI=redis://redis:6379/0
    volumes:
      - redis_test_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: on-failure

  blarify:
    build:
      context: ./src/codestory_blarify
      dockerfile: Dockerfile
    container_name: codestory-blarify-test
    volumes:
      - ./src/codestory_blarify:/app
    working_dir: /app
    command: ["sleep", "infinity"]

volumes:
  neo4j_test_data:
    name: codestory-neo4j-test-data
  neo4j_test_logs:
    name: codestory-neo4j-test-logs
  redis_test_data:
    name: codestory-redis-test-data